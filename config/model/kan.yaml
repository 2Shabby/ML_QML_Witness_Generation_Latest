# KAN (Kolmogorov-Arnold Network) Witness Learner Configuration

# @package _global_
model:
  type: "kan"

  # KAN-specific architecture
  n_layers: 3  # Number of KAN layers
  layer_sizes: [80, 40, 20, 1]  # Nodes per layer (input size determined by data)

  # Spline configuration
  grid_size: 5  # Number of grid points for B-splines
  spline_order: 3  # Cubic B-splines
  base_activation: "silu"  # Base activation (SiLU/Swish recommended)

  # Regularization
  l1_penalty: 0.01  # L1 on spline coefficients for sparsity
  entropy_penalty: 0.001  # Encourage sparse edge activations

  # Optimizer
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001

  random_state: ${seed}

# Training configuration
training:
  batch_size: 32
  epochs: 200
  validation_split: 0.25

  # Early stopping
  early_stopping: true
  patience: 30
  min_delta: 1e-5

  # Learning rate schedule
  use_lr_schedule: true
  lr_schedule_type: "cosine"  # "cosine" or "reduce_on_plateau"
  warmup_epochs: 10

  verbose: 1

# Symbolic extraction (for interpretability)
symbolic:
  enabled: true
  function_families:
    - "polynomial"  # x, x^2, x^3, etc.
    - "trigonometric"  # sin(x), cos(x)
    - "exponential"  # exp(x), log(x)
    - "rational"  # 1/x, 1/(1+x)

  # Fitting tolerance
  fit_tolerance: 1e-3
  simplification: true

# Note: KAN implementation requires custom layers (not yet implemented in TensorFlow)
# Will need dedicated KAN library or custom implementation
