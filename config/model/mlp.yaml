# MLP Witness Learner Configuration

# @package _global_
model:
  type: "mlp"

  # Architecture
  hidden_layers: [128, 64, 32]  # List of hidden layer sizes
  activation: "relu"  # "relu", "tanh", "sigmoid", "elu"
  output_activation: "sigmoid"  # For binary classification

  # Regularization
  dropout_rate: 0.3  # Dropout after each hidden layer
  use_batch_norm: false
  l2_reg: 0.01  # L2 regularization strength

  # Optimizer
  optimizer: "adam"  # "adam", "sgd", "rmsprop"
  learning_rate: 0.001
  beta_1: 0.9  # Adam parameter
  beta_2: 0.999  # Adam parameter
  momentum: 0.9  # SGD parameter

  # Loss function
  loss: "binary_crossentropy"

  random_state: ${seed}

# Training configuration
training:
  batch_size: 32
  epochs: 100
  validation_split: 0.2
  shuffle: true

  # Early stopping
  early_stopping: true
  patience: 15
  min_delta: 1e-4

  # Learning rate schedule
  use_lr_schedule: true
  lr_schedule_type: "reduce_on_plateau"  # "reduce_on_plateau", "exponential"
  lr_reduction_factor: 0.5
  lr_reduction_patience: 5
  min_lr: 1e-6

  # Callbacks
  verbose: 1

# Mixed precision training (for GPU)
mixed_precision: false
