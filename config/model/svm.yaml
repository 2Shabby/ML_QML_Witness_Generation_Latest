# SVM Witness Learner Configuration

# @package _global_
model:
  type: "svm"

  # SVM-specific parameters
  C: 1.0  # Regularization parameter
  kernel: "linear"  # "linear", "rbf", "poly"
  degree: 3  # For polynomial kernel
  gamma: "scale"  # "scale", "auto", or float

  # Sparse witness learning
  use_l1: false  # Use L1 regularization for sparse witnesses
  l1_alpha: 1.0  # L1 penalty strength
  dual: true  # Solve dual or primal (primal for L1)

  # Class weights for imbalanced datasets
  class_weight: null  # null, "balanced", or dict

  # Probability estimates
  probability: true

  random_state: ${seed}

# Training specific to SVM
training:
  max_iter: 1000
  tol: 1e-4
  cache_size: 200  # MB
  verbose: false
