# Default configuration for ML/QML Witness Generation Framework
# Override with specific model configs or experiment configs

# Random seed for reproducibility
seed: 42

# System configuration
system:
  n_qubits: 2
  system_type: "qubit"  # "qubit" or "qutrit"

# Data generation
data:
  n_samples: 1000
  entangled_fraction: 0.5
  test_size: 0.2
  n_components: 5  # for separable state generation
  add_noise: false
  noise_level: 0.0
  noise_type: "depolarizing"  # "depolarizing", "amplitude_damping", "phase_damping"

# Feature extraction
features:
  basis_type: "pauli"  # "pauli" for qubits, "gellmann" for qutrits
  include_identity: false
  normalize: true
  sparse_measurements: false
  sparse_strategy: "random"  # "random", "local", "two_body"
  n_sparse_features: null  # null = use all features

# Model configuration (defaults, override with specific model configs)
model:
  type: "svm"  # "svm", "mlp", "kan", "xgboost", "qsvc", "vqc"
  random_state: ${seed}

# Training configuration
training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  early_stopping: true
  patience: 10
  validation_split: 0.2

# Evaluation
evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "auc"
  volume_test_size: 10000
  noise_robustness_test: true
  noise_range: [0.0, 0.5, 10]  # [start, stop, num_points]

# Witness extraction
witness:
  sparse_threshold: 0.1
  extract_symbolic: false  # for KAN
  measurement_optimization: true

# Logging and output
logging:
  level: "INFO"  # "DEBUG", "INFO", "WARNING", "ERROR"
  log_to_file: true
  log_dir: "logs"
  tensorboard: true
  tensorboard_dir: "runs"

# Checkpointing
checkpoint:
  enabled: true
  save_dir: "checkpoints"
  save_frequency: 10  # epochs
  keep_best_only: true

# Output
output:
  save_dir: "results"
  save_witness: true
  save_model: true
  save_metrics: true
  save_plots: true
