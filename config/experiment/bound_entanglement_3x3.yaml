# Use-Case 2 & 3: 3×3 Bound Entanglement Detection with KAN

# @package _global_

defaults:
  - /defaults
  - /model/kan
  - _self_

experiment_name: "bound_entanglement_3x3"

# System: 3×3 qutrits
system:
  n_qubits: 2  # But interpreted as qutrits
  system_type: "qutrit"

# Dataset: bound entangled vs. separable
data:
  n_samples: 2000  # Smaller due to generation complexity
  entangled_fraction: 0.5
  test_size: 0.25  # Larger test set for validation
  # BE-specific: generate PPT-entangled states
  bound_entangled: true
  construction_methods:
    - "upb"  # Unextendible Product Basis
    - "magic_symmetric"
    - "numerical"

# Features: Gell-Mann basis (80 dimensional)
features:
  basis_type: "gellmann"
  include_identity: false
  normalize: true
  # 9^2 - 1 = 80 Gell-Mann operators

# KAN for symbolic witness discovery
model:
  type: "kan"
  # Model defined in model/kan.yaml

training:
  epochs: 200
  patience: 30

# Evaluation: symbolic extraction
evaluation:
  extract_symbolic_witness: true
  symbolic_function_families:
    - "polynomial"
    - "trigonometric"
    - "exponential"
  symbolic_simplification: true
  validate_on_known_be_states: true

witness:
  extract_symbolic: true
  symbolic_tolerance: 1e-3

output:
  save_dir: "results/bound_entanglement_3x3"
  save_symbolic_witness: true
  save_witness_formula: true  # Human-readable formula
